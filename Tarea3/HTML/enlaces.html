<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enlaces externos naranjas</title>
</head>
<body>
  <h1>Enlaces externos naranjas</h1>
  <p>Los enlaces cuyo href contiene :// se muestran en naranja.</p>
  <!-- Los dos primeros enlaces son externos; el enlace al índice es interno y no se modifica. -->
  <ul>
    <li><a href="https://www.wikipedia.org/">Wikipedia (externo)</a></li>
    <li><a href="https://www.freecodecamp.org/">freeCodeCamp (externo)</a></li>
    <li><a href="index.html">Índice (interno)</a></li>
  </ul>
  <!-- Enlace de navegación de vuelta al menú principal de la práctica. -->
  <p><a href="index.html">Volver al índice</a></p>

  <script>
    // Selecciona todos los enlaces cuyo href contiene ://, criterio usado aquí para identificarlos como externos.
    var enlaces = document.querySelectorAll('a[href*="://"]');

    // Aplica directamente el color naranja a cada enlace encontrado.
    for (var i = 0; i < enlaces.length; i++) {
      enlaces[i].style.color = "orange";
    }
  </script>
</body>
</html>
